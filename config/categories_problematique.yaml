# Cartographie déclarative problématique -> catégories, sans IA. Reprend
# les 19 sujets déjà suivis (recherche_pubmed.SUJETS) + quelques mots-clés
# déclencheurs en français, pour qu'une problématique tapée en français
# retrouve les bonnes catégories sans appel API. Ajouter une catégorie ici
# ne nécessite ni clé Anthropic ni redéploiement d'un modèle.

categories:
  - nom_categorie: "Nutrition / suppléments"
    requete_pubmed: "fertility nutrition supplementation randomized women"
    mots_cles: [nutrition, alimentation, complement, complements, supplementation, vitamine, magnesium, zinc]

  - nom_categorie: "Exposition environnementale"
    requete_pubmed: "fertility endocrine disruptor environmental exposure"
    mots_cles: [environnement, environnementale, perturbateur, pollution, toxique, plastique, pesticide]

  - nom_categorie: "Activité physique / mode de vie"
    requete_pubmed: "fertility physical activity lifestyle women randomized"
    mots_cles: [sport, activite physique, exercice, mode de vie, sedentarite]

  - nom_categorie: "Sommeil / stress"
